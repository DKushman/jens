name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: |
          rm -rf docs
          cp -R dist docs
          touch docs/.nojekyll

      - uses: EndBug/add-and-commit@v9
        with:
          add: docs
          message: Deploy site to docs
          push: true
